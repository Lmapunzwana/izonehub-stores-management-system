spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stores}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  company:
    name: ${COMPANY_NAME:New Sahara Ventures (Pvt) Ltd}
    address-line1: ${COMPANY_ADDRESS_LINE1:43 Coull Drive, Mount Pleasant, Harare}
    address-line2: ${COMPANY_ADDRESS_LINE2:Zimbabwe}
    phone: ${COMPANY_PHONE:+263 242 301 279 / +263 773 436 391}
    email: ${COMPANY_EMAIL:info@nsv.co.zw}
    website: ${COMPANY_WEBSITE:www.nsv.co.zw}
    logo-classpath: ${COMPANY_LOGO_CLASSPATH:logo.jpeg}
    brand-color: ${COMPANY_BRAND_COLOR:#1F7A3D}

  # Base URL of the frontend (used in password reset links and welcome emails).
  # Must be set explicitly — no default, as a wrong value sends broken links.
  base-url: ${APP_BASE_URL}

  # Email / Notification
  # provider: logging (default/no-op), resend (Resend.com), ses (AWS SES)
  email:
    provider: ${APP_EMAIL_PROVIDER:resend}
    from-address: ${APP_EMAIL_FROM:Notifications <notifications@mail.nsv.co.zw>}
    resend-api-key: ${RESEND_API_KEY:}
    ses-region: ${APP_EMAIL_SES_REGION:us-east-1}

  jwt:
    issuer: izonehub-stores
    # JWT_SECRET must be set via environment variable — no default is provided
    # so that the application fails to start rather than silently using a
    # publicly-known key. Generate with: openssl rand -hex 64
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7

  cors:
    # Comma-separated list of allowed frontend origins.
    # For local dev: http://localhost:3000
    # For production: https://stores.newsaharaventures.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://stores.nsv.co.zw,https://izonehub-stores-management-system.pages.dev,http://localhost:3000}

  security:
    max-failed-logins: 5
    login-rate-limit-attempts: 10
    login-rate-limit-minutes: 15
    # Only trust X-Forwarded-For when behind a known reverse proxy (nginx in K3s).
    # Set to true in production; leave false for local Docker Compose.
    trust-proxy: ${TRUST_PROXY:false}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-domain: ${COOKIE_DOMAIN:}
    cookie-same-site: ${COOKIE_SAME_SITE:None}

  csp: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
