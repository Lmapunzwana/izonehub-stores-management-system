# All secrets are loaded from a .env file (not committed to source control).
# Copy .env.example to .env and fill in values before running docker compose up.
#
# Required variables:
#   POSTGRES_PASSWORD     - postgres superuser password
#   SPRING_DATASOURCE_PASSWORD - same value as POSTGRES_PASSWORD
#   JWT_SECRET            - random 64-byte hex string (openssl rand -hex 64)
#   APP_BASE_URL          - frontend URL for password reset links (e.g. http://localhost:3000)
#
# See .env.example for the full list.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: stores
      POSTGRES_USER: stores
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Bind ONLY to loopback — never expose Postgres on all network interfaces.
    # Direct DB access via psql is available at 127.0.0.1:5432 for development.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stores -d stores"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stores
      SPRING_DATASOURCE_USERNAME: stores
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_EMAIL_PROVIDER: ${APP_EMAIL_PROVIDER:-logging}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://frontend:3000}
      COOKIE_SECURE: "false"       # HTTP-only in local dev; override to true in prod
      COOKIE_DOMAIN: ""
      TRUST_PROXY: "false"         # No reverse proxy in local Docker Compose
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 75s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    environment:
      BACKEND_URL: http://backend:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
