apiVersion: v1
kind: Secret
metadata:
  name: stores-backend-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:postgresql://managed-postgres:5432/stores
  SPRING_DATASOURCE_USERNAME: stores
  SPRING_DATASOURCE_PASSWORD: change-me-to-secure-password
  BACKUP_DATABASE_URL: postgresql://stores:change-me-to-secure-password@managed-postgres:5432/stores
  JWT_SECRET: replace-with-64-byte-hex-random-secret
  APP_BASE_URL: https://stores.newsaharaventures.com
  CORS_ALLOWED_ORIGINS: https://stores.newsaharaventures.com
  TRUST_PROXY: "true"
