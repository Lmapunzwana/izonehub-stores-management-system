apiVersion: apps/v1
kind: Deployment
metadata:
  name: stores-backend
  labels:
    app: stores-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stores-backend
  template:
    metadata:
      labels:
        app: stores-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/lmapunzwana/stores-management-system/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: stores-backend-secrets
          env:
            # Cookies must be Secure in production (HTTPS)
            - name: COOKIE_SECURE
              value: "true"
            - name: COOKIE_DOMAIN
              value: .nsv.co.zw
            # Trust reverse proxy (nginx ingress) for X-Forwarded-For resolution
            - name: TRUST_PROXY
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stores-backend
spec:
  selector:
    app: stores-backend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stores-backend-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.stores.nsv.co.zw
      secretName: stores-backend-tls
  rules:
    - host: api.stores.nsv.co.zw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stores-backend
                port:
                  number: 80
