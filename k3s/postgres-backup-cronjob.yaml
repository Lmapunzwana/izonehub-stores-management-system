apiVersion: batch/v1
kind: CronJob
metadata:
  name: stores-postgres-backup
spec:
  schedule: "0 22 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:15-alpine
              envFrom:
                - secretRef:
                    name: stores-backend-secrets
              command: ["/bin/sh", "-c"]
              args:
                - |
                  if [ -z "$BACKUP_DATABASE_URL" ]; then
                    echo "ERROR: BACKUP_DATABASE_URL environment variable is missing!"
                    exit 1
                  fi
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backup/stores_${TIMESTAMP}.sql.gz"
                  echo "Starting database dump to ${BACKUP_FILE}..."
                  pg_dump "$BACKUP_DATABASE_URL" | gzip > "$BACKUP_FILE"
                  echo "Backup completed. Cleaning up backups older than 30 days..."
                  find /backup -name "stores_*.sql.gz" -mtime +30 -delete
                  echo "Backup routine finished."
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: stores-postgres-backup
